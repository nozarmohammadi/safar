<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ماشین‌حساب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2942">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#0a1628;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#fff;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(201,169,97,0.12),transparent 45%),radial-gradient(circle at 80% 90%,rgba(59,130,246,0.08),transparent 45%);pointer-events:none;z-index:0}
.wrap{max-width:440px;width:100%;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar a{color:#c9a961;text-decoration:none;font-size:24px;padding:4px 8px;font-weight:300}
.topbar .title{color:#fff;font-size:15px;font-weight:700;flex:1}
.display{background:#0f2942;color:#fff;padding:22px 18px;border-radius:16px;margin-bottom:12px;direction:ltr;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;word-wrap:break-word;overflow-wrap:break-word;border:1px solid rgba(201,169,97,0.2);box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.display .expr{font-size:14px;color:#7a8fa8;min-height:20px;margin-bottom:6px;text-align:right;direction:rtl}
.display .result{font-size:38px;color:#c9a961;font-weight:800;text-align:left;letter-spacing:-1px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btns button{padding:22px 8px;font-size:22px;font-weight:700;background:rgba(255,255,255,0.05);color:#fff;border:1px solid rgba(255,255,255,0.08);border-radius:14px;cursor:pointer;font-family:inherit;transition:all 0.1s}
.btns button:active{transform:scale(0.94);background:rgba(255,255,255,0.12)}
.btns button.op{background:#0f2942;color:#c9a961;border-color:rgba(201,169,97,0.3)}
.btns button.op:active{background:#1a3a5c}
.btns button.eq{background:linear-gradient(135deg,#c9a961,#a88a45);color:#0a1628;border-color:transparent;box-shadow:0 4px 14px rgba(201,169,97,0.4)}
.btns button.wide{grid-column:span 2}
.btns button.danger{background:rgba(220,38,38,0.15);color:#f87171;border-color:rgba(220,38,38,0.3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html">‹</a>
    <div class="title">🧮 ماشین‌حساب</div>
  </div>
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="res">0</div>
  </div>
  <div class="btns">
    <button class="danger" onclick="clr()">C</button>
    <button class="op" onclick="back()">⌫</button>
    <button class="op" onclick="op('%')">%</button>
    <button class="op" onclick="op('÷')">÷</button>
    <button onclick="num('7')">7</button>
    <button onclick="num('8')">8</button>
    <button onclick="num('9')">9</button>
    <button class="op" onclick="op('×')">×</button>
    <button onclick="num('4')">4</button>
    <button onclick="num('5')">5</button>
    <button onclick="num('6')">6</button>
    <button class="op" onclick="op('-')">−</button>
    <button onclick="num('1')">1</button>
    <button onclick="num('2')">2</button>
    <button onclick="num('3')">3</button>
    <button class="op" onclick="op('+')">+</button>
    <button class="wide" onclick="num('0')">0</button>
    <button onclick="num('.')">.</button>
    <button class="eq" onclick="eq()">=</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let cur='0', prev=null, operator=null, expr='';

function upd(){
  $('res').textContent = cur;
  $('expr').textContent = expr;
}

function num(d){
  if(cur==='0' && d!=='.') cur = d;
  else if(d==='.' && cur.includes('.')) return;
  else cur += d;
  upd();
}

function op(o){
  if(operator !== null && prev !== null) eq();
  prev = parseFloat(cur);
  operator = o;
  expr = cur + ' ' + o;
  cur = '0';
  upd();
}

function eq(){
  if(operator === null || prev === null) return;
  const a = prev, b = parseFloat(cur);
  let r = 0;
  if(operator === '+') r = a + b;
  else if(operator === '-') r = a - b;
  else if(operator === '×') r = a * b;
  else if(operator === '÷') r = b === 0 ? 'خطا' : a / b;
  else if(operator === '%') r = a * b / 100;
  
  if(r === 'خطا') { cur = 'خطا'; }
  else { cur = String(Math.round(r * 1000000) / 1000000); }
  
  expr = prev + ' ' + operator + ' ' + b + ' =';
  prev = null;
  operator = null;
  upd();
}

function clr(){
  cur = '0';
  prev = null;
  operator = null;
  expr = '';
  upd();
}

function back(){
  if(cur.length > 1) cur = cur.slice(0, -1);
  else cur = '0';
  upd();
}

upd();
</script>
</body>
</html>
