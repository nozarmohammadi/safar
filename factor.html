<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاکتور کرکره</title>
<style>
  :root { --bg: #f5f5f5; --card: #fff; --border: #ddd; --text: #222; --muted: #777; --accent: #1e40af; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Tahoma, sans-serif; background: var(--bg); color: var(--text); padding: 12px; line-height: 1.6; }
  .wrap { max-width: 800px; margin: 0 auto; }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin-bottom: 12px; color: var(--accent); }
  h2 { font-size: 14px; margin-bottom: 8px; color: var(--muted); }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; margin-bottom: 10px; background: #fafafa; }
  textarea { min-height: 140px; resize: vertical; font-size: 13px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button { padding: 11px 16px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; margin-left: 8px; }
  button.ghost { background: #e5e7eb; color: #333; }
  .btn-row { display: flex; justify-content: flex-end; margin-top: 8px; }

  #invoice { display: none; background: white; padding: 24px; border-radius: 10px; margin-top: 14px; border: 1px solid var(--border); }
  .inv-header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 14px; }
  .inv-header h1 { color: var(--accent); font-size: 22px; margin-bottom: 4px; }
  .inv-header p { font-size: 12px; color: var(--muted); }
  .inv-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 14px; }
  .inv-info > div { line-height: 1.9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f0f4ff; padding: 8px; text-align: right; border: 1px solid var(--border); font-size: 12px; color: var(--accent); }
  td { padding: 8px; border: 1px solid var(--border); vertical-align: top; }
  td.num { text-align: center; width: 40px; }
  td.price { text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; width: 130px; }
  tr.total-row { background: #f0f4ff; font-weight: bold; font-size: 15px; }
  .inv-footer { margin-top: 20px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .hint { font-size: 11px; color: #999; margin-top: 6px; }

  @media print {
    body { background: white; padding: 0; }
    .box, #makeBtn, h1, .btn-row, .hint { display: none !important; }
    #invoice { display: block !important; border: none; padding: 0; margin: 0; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>🧾 فاکتور کرکره</h1>

  <div class="box">
    <h2>اطلاعات فاکتور</h2>
    <div class="row">
      <div>
        <label>شماره فاکتور</label>
        <input id="invNum" placeholder="مثلاً 1403-125">
      </div>
      <div>
        <label>تاریخ</label>
        <input id="invDate">
      </div>
    </div>
    <label>نام مشتری</label>
    <input id="customer" placeholder="مثلاً آقای احمدی">
    <label>شماره تماس</label>
    <input id="phone" placeholder="0912...">
  </div>

  <div class="box">
    <h2>متن سفارش (هر خط یه آیتم)</h2>
    <textarea id="orderText" placeholder="مثال:
تیغه کرکره خوب آکریل (13 متر) 71,760,000
موتور ساید خوب سیم مس 34,250,000
ریل آهنی (3.5 × 7 متر) 900,000
دستمزد نصب و کرایه 10,000,000"></textarea>
    <p class="hint">💡 قیمت رو با کاما یا بدون کاما، اول یا آخر خط بنویس — خودش پیدا می‌کنه</p>
  </div>

  <div class="btn-row">
    <button class="ghost" onclick="clearAll()">پاک کردن</button>
    <button id="makeBtn" onclick="makeInvoice()">ساخت فاکتور</button>
  </div>

  <div id="invoice">
    <div class="inv-header">
      <h1 id="shopName">کرکره‌سازی</h1>
      <p id="shopInfo">تلفن: —</p>
    </div>
    <div class="inv-info">
      <div>
        <div><b>مشتری:</b> <span id="invCustomer">—</span></div>
        <div><b>تلفن:</b> <span id="invPhone">—</span></div>
      </div>
      <div style="text-align:left;">
        <div><b>شماره:</b> <span id="invNumPrint">—</span></div>
        <div><b>تاریخ:</b> <span id="invDatePrint">—</span></div>
      </div>
    </div>
    <table id="invTable">
      <thead>
        <tr>
          <th>#</th>
          <th>شرح</th>
          <th>قیمت (تومان)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="inv-footer">
      <div>امضاء فروشنده</div>
      <div>امضاء مشتری</div>
    </div>
  </div>

  <div class="btn-row" id="printRow" style="display:none;">
    <button onclick="window.print()">🖨️ چاپ / PDF</button>
  </div>

</div>

<script>
  const today = new Date().toLocaleDateString('fa-IR');
  document.getElementById('invDate').value = today;

  const savedShop = localStorage.getItem('shopName') || 'کرکره‌سازی';
  const savedInfo = localStorage.getItem('shopInfo') || 'تلفن: —';
  document.getElementById('shopName').textContent = savedShop;
  document.getElementById('shopInfo').textContent = savedInfo;

  const fa = n => n.toLocaleString('fa-IR');

  // تبدیل اعداد فارسی به انگلیسی
  function toEnNum(str) {
    const fa = '۰۱۲۳۴۵۶۷۸۹';
    const ar = '٠١٢٣٤٥٦٧٨٩';
    return str.replace(/[۰-۹٠-٩]/g, d => {
      const i = fa.indexOf(d);
      if (i > -1) return i;
      return ar.indexOf(d);
    });
  }

  // پیدا کردن قیمت توی خط (هر عددی با حداقل ۳ رقم یا با کاما)
  function extractPrice(line) {
    const normalized = toEnNum(line);
    // همه اعداد با کاما یا ۴ رقم و بیشتر
    const matches = normalized.match(/\d{1,3}(?:,\d{3})+|\d{4,}/g);
    if (!matches) return { desc: line, price: 0 };
    // بزرگ‌ترین عدد = قیمت
    let max = 0, maxRaw = '';
    matches.forEach(m => {
      const n = +m.replace(/,/g, '');
      if (n > max) { max = n; maxRaw = m; }
    });
    // حذف قیمت از شرح
    const desc = line.replace(new RegExp(maxRaw.replace(/,/g, '[,،]?'), 'g'), '').replace(/[\s\-–—]+$/, '').replace(/[\s\-–—]+/g, ' ').trim();
    return { desc: desc || line, price: max };
  }

  function makeInvoice() {
    const customer = document.getElementById('customer').value.trim() || '—';
    const phone = document.getElementById('phone').value.trim() || '—';
    const num = document.getElementById('invNum').value.trim() || '—';
    const date = document.getElementById('invDate').value.trim() || today;
    const text = document.getElementById('orderText').value.trim();

    if (!text) { alert('متن سفارش رو وارد کن'); return; }

    document.getElementById('invCustomer').textContent = customer;
    document.getElementById('invPhone').textContent = phone;
    document.getElementById('invNumPrint').textContent = num;
    document.getElementById('invDatePrint').textContent = date;

    const tbody = document.querySelector('#invTable tbody');
    tbody.innerHTML = '';

    const lines = text.split('\n').filter(l => l.trim());
    let total = 0;
    let rowNum = 1;
    const items = [];

    lines.forEach(line => {
      // نادیده گرفتن خط جمع کل
      if (/جمع\s*کل|مجموع|total/i.test(line)) return;
      // نادیده گرفتن خط خالی یا تزئینی
      if (/^[\s\-=_.]+$/.test(line)) return;

      const { desc, price } = extractPrice(line);
      total += price;
      items.push({ desc, price });
    });

    items.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="num">${fa(rowNum)}</td>
        <td>${item.desc}</td>
        <td class="price">${item.price ? fa(item.price) : '—'}</td>
      `;
      tbody.appendChild(tr);
      rowNum++;
    });

    if (total > 0) {
      const totalRow = document.createElement('tr');
      totalRow.className = 'total-row';
      totalRow.innerHTML = `
        <td></td>
        <td>جمع کل</td>
        <td class="price">${fa(total)} تومان</td>
      `;
      tbody.appendChild(totalRow);
    }

    document.getElementById('invoice').style.display = 'block';
    document.getElementById('printRow').style.display = 'flex';
    document.getElementById('invoice').scrollIntoView({ behavior: 'smooth' });
  }

  function clearAll() {
    if (!confirm('همه چیز پاک بشه؟')) return;
    document.getElementById('customer').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('invNum').value = '';
    document.getElementById('orderText').value = '';
    document.getElementById('invoice').style.display = 'none';
    document.getElementById('printRow').style.display = 'none';
  }
</script>
</body>
</html>
