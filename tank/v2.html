<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tank Arena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;font-family:Tahoma,sans-serif;background:#050810;color:#fff;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}
.controls{position:fixed;bottom:0;left:0;right:0;height:200px;pointer-events:none;z-index:10}
.joy-zone{position:absolute;left:15px;bottom:15px;width:160px;height:160px;pointer-events:auto}
.joy-base{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.1),rgba(255,255,255,0.03));border:2px solid rgba(255,255,255,0.15);position:absolute;top:0;left:0;backdrop-filter:blur(4px)}
.joy-knob{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e5c97a,#a88a45);border:2px solid #c9a961;position:absolute;top:45px;left:45px;box-shadow:0 6px 20px rgba(201,169,97,0.5)}
.actions{position:absolute;right:15px;bottom:15px;pointer-events:auto;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.btn-fire{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff4444,#991b1b);border:3px solid rgba(255,200,200,0.4);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 10px 30px rgba(220,38,38,0.6),inset 0 -4px 10px rgba(0,0,0,0.3);cursor:pointer}
.btn-fire:active{transform:scale(0.93)}
.btn-dash{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#5ba3ff,#1e40af);border:3px solid rgba(200,220,255,0.4);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;box-shadow:0 6px 20px rgba(59,130,246,0.6);cursor:pointer;position:absolute;right:135px;bottom:15px}
.btn-dash:active{transform:scale(0.9)}
.btn-weapon{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,0.6);border:2px solid #c9a961;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;backdrop-filter:blur(8px);color:#c9a961}
.hud{position:fixed;top:0;left:0;right:0;padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
.hud-player{flex:1;max-width:220px}
.hud-player.right{text-align:left}
.hud-player.left{text-align:right}
.hud-name{font-size:11px;font-weight:700;margin-bottom:3px;letter-spacing:0.5px}
.hud-name.p1{color:#ff5555}
.hud-name.ai{color:#5580ff}
.hud-bar{height:12px;background:rgba(0,0,0,0.7);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);position:relative}
.hud-fill{height:100%;transition:width 0.25s;border-radius:6px}
.hud-fill.p1{background:linear-gradient(90deg,#dc3232,#ff7777);box-shadow:0 0 10px rgba(255,85,85,0.6)}
.hud-fill.ai{background:linear-gradient(90deg,#3264dc,#7799ff);box-shadow:0 0 10px rgba(85,128,255,0.6)}
.weapon-bar{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;pointer-events:none}
.wpn{padding:5px 12px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);border-radius:8px;font-size:11px;font-weight:700;color:#8892a8;backdrop-filter:blur(8px);transition:all 0.2s}
.wpn.active{background:linear-gradient(135deg,#c9a961,#a88a45);color:#0a0e1a;border-color:#c9a961;box-shadow:0 0 15px rgba(201,169,97,0.5)}
.ammo{position:fixed;bottom:245px;right:20px;z-index:10;font-size:20px;font-weight:900;color:#c9a961;text-shadow:0 2px 8px rgba(0,0,0,0.8);pointer-events:none;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(15,25,45,0.98),rgba(5,8,16,0.99));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:100}
.overlay h1{font-size:38px;margin-bottom:8px;background:linear-gradient(135deg,#e5c97a,#c9a961,#a88a45);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;letter-spacing:2px}
.overlay p{font-size:13px;color:#8892a8;margin-bottom:24px;line-height:1.9}
.overlay button{background:linear-gradient(135deg,#c9a961,#a88a45);color:#0a0e1a;border:none;padding:18px 55px;border-radius:14px;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(201,169,97,0.5);letter-spacing:1px}
.overlay button:active{transform:scale(0.96)}
.tip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 20px;margin-bottom:20px;font-size:12px;color:#8892a8;line-height:2;text-align:right;max-width:340px}
.tip b{color:#c9a961}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="hud-player left">
    <div class="hud-name p1">👤 تو</div>
    <div class="hud-bar"><div class="hud-fill p1" id="hp1" style="width:100%"></div></div>
  </div>
  <div class="hud-player right">
    <div class="hud-name ai">🤖 ربات</div>
    <div class="hud-bar"><div class="hud-fill ai" id="hpa" style="width:100%"></div></div>
  </div>
</div>
<div class="weapon-bar">
  <div class="wpn active" id="wpn1">🔫 پیستول</div>
  <div class="wpn" id="wpn2">💥 شاتگان</div>
  <div class="wpn" id="wpn3">⚡ لیزر</div>
</div>
<div class="ammo" id="ammo">∞</div>
<div class="controls" id="controls" style="display:none">
  <div class="joy-zone" id="joyZone">
    <div class="joy-base"></div>
    <div class="joy-knob" id="joyKnob"></div>
  </div>
  <div class="actions">
    <div class="btn-fire" id="btnFire">🔥</div>
  </div>
  <div class="btn-dash" id="btnDash">⚡</div>
  <div class="btn-weapon" id="btnWeapon">🔫</div>
</div>
<div class="overlay" id="startScreen">
  <h1>TANK ARENA</h1>
  <p>نبرد تانک حرفه‌ای</p>
  <div class="tip">
    <b>حرکت:</b> جوی‌استیک چپ<br>
    <b>شلیک:</b> دکمه قرمز<br>
    <b>تغییر اسلحه:</b> دکمه 🔫<br>
    <b>دَش:</b> دکمه ⚡
  </div>
  <button onclick="startGame()">شروع بازی</button>
</div>
<div class="overlay" id="winScreen" style="display:none">
  <div style="font-size:80px;margin-bottom:20px" id="winEmoji">🏆</div>
  <div style="font-size:42px;font-weight:900;margin-bottom:10px" id="winText">بردی!</div>
  <div style="font-size:14px;color:#8892a8;margin-bottom:30px" id="winSub">آفرین!</div>
  <button onclick="restartGame()">دست جدید</button>
</div>
<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const n = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, n);
  o.frequency.exponentialRampToValueAtTime(freq * 0.3, n + dur);
  g.gain.setValueAtTime(vol || 0.08, n);
  g.gain.exponentialRampToValueAtTime(0.001, n + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(n); o.stop(n + dur);
}
function playShoot(w) {
  if (w === 'pistol') beep(900, 0.08, 'square', 0.07);
  else if (w === 'shotgun') { beep(300, 0.15, 'sawtooth', 0.1); setTimeout(()=>beep(200,0.1,'sawtooth',0.06), 30); }
  else if (w === 'laser') beep(1500, 0.06, 'sine', 0.05);
}
function playHit() { beep(180, 0.2, 'sawtooth', 0.12); }
function playDash() { beep(500, 0.15, 'sine', 0.06); }
function playWin() { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle',0.12),i*100)); }
function playLose() { [392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'sawtooth',0.1),i*150)); }
function playReload() { beep(400, 0.05, 'square', 0.06); setTimeout(()=>beep(600,0.05,'square',0.06),80); }

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = window.innerWidth; H = window.innerHeight; canvas.width = W; canvas.height = H; }
resize();
window.addEventListener('resize', resize);

const C = { bg:'#050810', grid:'#0d1525', wall:'#2a3a52', wallTop:'#3d5070', p1:'#dc3232', p1Light:'#ff5555', ai:'#3264dc', aiLight:'#5580ff' };

const WEAPONS = {
  pistol: { name:'پیستول', icon:'🔫', cooldown:18, bulletSpeed:11, damage:10, spread:0.02, bullets:1, ammo:Infinity, color:'#ffd700', reload:0 },
  shotgun: { name:'شاتگان', icon:'💥', cooldown:45, bulletSpeed:9, damage:8, spread:0.25, bullets:6, ammo:30, color:'#ff8800', reload:120 },
  laser: { name:'لیزر', icon:'⚡', cooldown:8, bulletSpeed:16, damage:4, spread:0, bullets:1, ammo:150, color:'#00ddff', reload:90 }
};

const input = { x:0, y:0, fire:false };

class Particle {
  constructor(x, y, color, size, speed, life) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*(speed||8);
    this.vy = (Math.random()-0.5)*(speed||8);
    this.life = life||30; this.maxLife = this.life;
    this.color = color;
    this.size = Math.random()*(size||4)+1.5;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vx*=0.94; this.vy*=0.94; this.life--; }
  draw(){
    const a = this.life/this.maxLife;
    ctx.globalAlpha = a;
    ctx.shadowBlur = 15; ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

function explosion(x, y, color, count) {
  count = count || 25;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI*2/count)*i;
    const speed = 5 + Math.random()*8;
    const p = new Particle(x, y, color, 5, 2, 45);
    p.vx = Math.cos(angle)*speed;
    p.vy = Math.sin(angle)*speed;
    particles.push(p);
  }
  for (let i = 0; i < 12; i++) particles.push(new Particle(x, y, '#ffa500', 4, 12, 30));
  for (let i = 0; i < 8; i++) particles.push(new Particle(x, y, '#ffffff', 3, 20, 20));
  shake = 18;
}

class Tank {
  constructor(x, y, color, colorLight, isAI) {
    this.x=x; this.y=y; this.color=color; this.colorLight=colorLight; this.isAI=isAI;
    this.angle = isAI ? Math.PI : 0;
    this.speed = 2.4; this.radius = 18; this.hp = 100; this.maxHp = 100;
    this.cooldown = 0; this.alive = true; this.shield = 0;
    this.dashCd = 0; this.dashTime = 0; this.dashDir = {x:0,y:0};
    this.flash = 0; this.trackOffset = 0;
    this.aiTimer = 0; this.aiStrafeDir = Math.random()>0.5?1:-1;
    this.lastDx = 0; this.lastDy = 0;
    this.weapon = 'pistol';
    this.ammo = {};
    for (const k in WEAPONS) this.ammo[k] = WEAPONS[k].ammo;
    this.reloading = 0;
    this.recoil = 0;
  }
  getRect() { return { x:this.x-this.radius, y:this.y-this.radius, w:this.radius*2, h:this.radius*2 }; }
  move(dx, dy) {
    if (dx===0 && dy===0) { if (this.dashTime>0) this.dashTime--; return; }
    const len = Math.hypot(dx, dy); dx/=len; dy/=len;
    this.trackOffset += 0.3;
    let spd = this.speed;
    if (this.dashTime>0) { dx=this.dashDir.x; dy=this.dashDir.y; spd=this.speed*3; this.dashTime--; }
    this.x += dx*spd; this.y += dy*spd; this.constrain();
  }
  constrain() {
    const r = this.radius;
    this.x = Math.max(r+15, Math.min(W-r-15, this.x));
    this.y = Math.max(r+15, Math.min(H-r-15, this.y));
    for (const w of WALLS) {
      const rect = this.getRect();
      if (rect.x < w.x+w.w && rect.x+rect.w > w.x && rect.y < w.y+w.h && rect.y+rect.h > w.y) {
        const ol = rect.x+rect.w-w.x, orr = w.x+w.w-rect.x, ot = rect.y+rect.h-w.y, ob = w.y+w.h-rect.y;
        const m = Math.min(ol, orr, ot, ob);
        if (m===ol) this.x -= ol; else if (m===orr) this.x += orr;
        else if (m===ot) this.y -= ot; else this.y += ob;
      }
    }
  }
  aimAt(tx, ty) { this.angle = Math.atan2(ty-this.y, tx-this.x); }
  shoot() {
    const w = WEAPONS[this.weapon];
    if (this.cooldown > 0 || !this.alive || this.reloading > 0) return [];
    if (this.ammo[this.weapon] <= 0 && w.ammo !== Infinity) { this.startReload(); return []; }
    if (w.ammo !== Infinity) this.ammo[this.weapon]--;
    this.cooldown = w.cooldown;
    if (!this.isAI) playShoot(this.weapon);
    this.recoil = 5;
    const bullets = [];
    for (let i = 0; i < w.bullets; i++) {
      const spread = (Math.random()-0.5) * w.spread;
      const a = this.angle + spread;
      const bx = this.x + Math.cos(this.angle) * (this.radius+5);
      const by = this.y + Math.sin(this.angle) * (this.radius+5);
      bullets.push(new Bullet(bx, by, a, w.color, this, w.bulletSpeed, w.damage));
    }
    return bullets;
  }
  startReload() {
    if (this.reloading > 0) return;
    const w = WEAPONS[this.weapon];
    if (w.ammo === Infinity) return;
    if (this.ammo[this.weapon] >= w.ammo) return;
    this.reloading = w.reload;
    if (!this.isAI) playReload();
  }
  switchWeapon() {
    const list = ['pistol','shotgun','laser'];
    const i = list.indexOf(this.weapon);
    this.weapon = list[(i+1) % list.length];
    updateWeaponUI();
  }
  dash(dx, dy) {
    if (this.dashCd<=0 && this.alive) {
      this.dashCd = this.isAI ? 80 : 100;
      this.dashTime = 10;
      if (dx===0 && dy===0) { dx=Math.cos(this.angle); dy=Math.sin(this.angle); }
      const l = Math.hypot(dx, dy);
      this.dashDir = { x:dx/l, y:dy/l };
      if (!this.isAI) playDash();
    }
  }
  update() {
    if (this.cooldown>0) this.cooldown--;
    if (this.dashCd>0) this.dashCd--;
    if (this.flash>0) this.flash--;
    if (this.recoil>0) this.recoil--;
    if (this.reloading>0) {
      this.reloading--;
      if (this.reloading === 0) {
        const w = WEAPONS[this.weapon];
        if (w.ammo !== Infinity) this.ammo[this.weapon] = w.ammo;
        if (!this.isAI) updateAmmoUI();
      }
    }
  }
  draw() {
    if (!this.alive) return;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(this.x + 4, this.y + 6, this.radius*1.15, this.radius*0.9, 0, 0, Math.PI*2);
    ctx.fill();
    const grad = ctx.createRadialGradient(this.x - this.radius*0.3, this.y - this.radius*0.3, 2, this.x, this.y, this.radius);
    if (this.flash > 0) { grad.addColorStop(0,'#fff'); grad.addColorStop(1,'#ddd'); }
    else { grad.addColorStop(0,this.colorLight); grad.addColorStop(0.7,this.color); grad.addColorStop(1,'#000'); }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius-5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a2a2a'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const a = this.trackOffset + (i*Math.PI/4);
      const tx = this.x + Math.cos(a)*(this.radius-7);
      const ty = this.y + Math.sin(a)*(this.radius-7);
      ctx.beginPath(); ctx.arc(tx, ty, 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
    const recoilOff = this.recoil > 0 ? -3 : 0;
    ctx.fillStyle = this.colorLight;
    ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    const bx = this.x + Math.cos(this.angle)*8;
    const by = this.y + Math.sin(this.angle)*8;
    const ex = this.x + Math.cos(this.angle)*(this.radius+18+recoilOff);
    const ey = this.y + Math.sin(this.angle)*(this.radius+18+recoilOff);
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = this.color; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
    if (this.shield > 0) {
      const sg = ctx.createRadialGradient(this.x, this.y, this.radius-3, this.x, this.y, this.radius+12);
      sg.addColorStop(0,'rgba(100,200,255,0.5)');
      sg.addColorStop(1,'rgba(100,200,255,0.05)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius+12, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(150,220,255,0.9)'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (this.hp < this.maxHp) {
      const bw = 50; const bx2 = this.x - bw/2; const by2 = this.y - this.radius - 18;
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(bx2-1, by2-1, bw+2, 8);
      const hpw = bw * (this.hp/this.maxHp);
      const hpc = this.hp > 50 ? '#16a34a' : this.hp > 25 ? '#eab308' : '#dc2626';
      ctx.fillStyle = hpc; ctx.fillRect(bx2, by2, hpw, 6);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.strokeRect(bx2, by2, bw, 6);
    }
  }
}

class Bullet {
  constructor(x, y, angle, color, owner, speed, damage) {
    this.x=x; this.y=y; this.angle=angle;
    this.speed = speed || 10; this.radius = 4;
    this.color=color; this.owner=owner; this.alive=true;
    this.damage = damage || 10;
    this.life = 120;
  }
  update() {
    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;
    this.life--;
    if (this.life <= 0) { this.alive = false; return; }
    if (this.x<0 || this.x>W || this.y<0 || this.y>H) { this.alive=false; return; }
    for (const w of WALLS) {
      if (this.x>w.x && this.x<w.x+w.w && this.y>w.y && this.y<w.y+w.h) {
        this.alive = false;
        for (let i=0; i<6; i++) particles.push(new Particle(this.x, this.y, this.color, 3, 8, 20));
        return;
      }
    }
  }
  draw() {
    for (let i = 0; i < 6; i++) {
      const a = (1-i/6)*0.6;
      ctx.globalAlpha = a;
      ctx.shadowBlur = 18; ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x - Math.cos(this.angle)*i*3, this.y - Math.sin(this.angle)*i*3, this.radius*(1-i/6), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius+4);
    grad.addColorStop(0,'#fff');
    grad.addColorStop(0.5,this.color);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius+4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius*0.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

let p1, ai, bullets, particles, WALLS, gameState = 'menu', shake = 0;
function makeWalls() {
  WALLS = [
    { x:0, y:0, w:W, h:15 }, { x:0, y:H-15, w:W, h:15 },
    { x:0, y:0, w:15, h:H }, { x:W-15, y:0, w:15, h:H },
    { x:W*0.12, y:H*0.18, w:22, h:H*0.16 }, { x:W*0.12, y:H*0.18, w:W*0.11, h:22 },
    { x:W*0.77, y:H*0.18, w:22, h:H*0.16 }, { x:W*0.66, y:H*0.18, w:W*0.11, h:22 },
    { x:W*0.12, y:H*0.66, w:22, h:H*0.16 }, { x:W*0.12, y:H*0.80, w:W*0.11, h:22 },
    { x:W*0.77, y:H*0.66, w:22, h:H*0.16 }, { x:W*0.66, y:H*0.80, w:W*0.11, h:22 },
    { x:W*0.45, y:H*0.44, w:W*0.1, h:18 }, { x:W*0.45, y:H*0.55, w:W*0.1, h:18 },
    { x:W*0.45, y:H*0.44, w:18, h:H*0.13 }, { x:W*0.49, y:H*0.44, w:18, h:H*0.13 }
  ];
}

function startGame() {
  initAudio();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('controls').style.display = 'block';
  makeWalls();
  p1 = new Tank(W*0.1, H*0.5, C.p1, C.p1Light, false);
  ai = new Tank(W*0.9, H*0.5, C.ai, C.aiLight, true);
  bullets = []; particles = []; shake = 0; gameState = 'playing';
  updateHUD(); updateWeaponUI(); updateAmmoUI();
}
function restartGame() { startGame(); }

function updateHUD() {
  if (p1) document.getElementById('hp1').style.width = (p1.hp/p1.maxHp*100) + '%';
  if (ai) document.getElementById('hpa').style.width = (ai.hp/ai.maxHp*100) + '%';
}
function updateWeaponUI() {
  const ids = { pistol:'wpn1', shotgun:'wpn2', laser:'wpn3' };
  for (const k in ids) document.getElementById(ids[k]).classList.toggle('active', p1.weapon === k);
  document.getElementById('btnWeapon').textContent = WEAPONS[p1.weapon].icon;
  updateAmmoUI();
}
function updateAmmoUI() {
  const a = p1.ammo[p1.weapon];
  const el = document.getElementById('ammo');
  if (a === Infinity) el.textContent = '∞';
  else if (p1.reloading > 0) el.textContent = '...';
  else el.textContent = a;
}

const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false, joyStart = {x:0,y:0}, joyMaxDist = 60;
joyZone.addEventListener('touchstart', e => {
  e.preventDefault(); joyActive = true;
  const r = joyZone.getBoundingClientRect();
  joyStart = { x: r.left+r.width/2, y: r.top+r.height/2 };
  handleJoy(e.touches[0]);
}, {passive:false});
joyZone.addEventListener('touchmove', e => { e.preventDefault(); if (joyActive) handleJoy(e.touches[0]); }, {passive:false});
joyZone.addEventListener('touchend', e => {
  e.preventDefault(); joyActive = false; input.x=0; input.y=0;
  joyKnob.style.left = '45px'; joyKnob.style.top = '45px';
}, {passive:false});
function handleJoy(t) {
  let dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y;
  const d = Math.hypot(dx, dy);
  if (d > joyMaxDist) { dx = dx/d*joyMaxDist; dy = dy/d*joyMaxDist; }
  joyKnob.style.left = (45+dx) + 'px'; joyKnob.style.top = (45+dy) + 'px';
  input.x = dx/joyMaxDist; input.y = dy/joyMaxDist;
}

document.getElementById('btnFire').addEventListener('touchstart', e => { e.preventDefault(); input.fire = true; }, {passive:false});
document.getElementById('btnFire').addEventListener('touchend', e => { e.preventDefault(); input.fire = false; }, {passive:false});
document.getElementById('btnDash').addEventListener('touchstart', e => { e.preventDefault(); if (p1) p1.dash(input.x, input.y); }, {passive:false});
document.getElementById('btnWeapon').addEventListener('touchstart', e => { e.preventDefault(); if (p1) p1.switchWeapon(); }, {passive:false});

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='w') input.y=-1; if (k==='s') input.y=1;
  if (k==='a') input.x=-1; if (k==='d') input.x=1;
  if (e.key===' ') { input.fire=true; e.preventDefault(); }
  if (k==='q' && p1) p1.dash(input.x, input.y);
  if (k==='1' && p1) { p1.weapon='pistol'; updateWeaponUI(); }
  if (k==='2' && p1) { p1.weapon='shotgun'; updateWeaponUI(); }
  if (k==='3' && p1) { p1.weapon='laser'; updateWeaponUI(); }
  if (k==='r' && p1) p1.startReload();
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k==='w'||k==='s') input.y=0;
  if (k==='a'||k==='d') input.x=0;
  if (e.key===' ') { input.fire=false; e.preventDefault(); }
});

function updateAI() {
  if (!ai || !ai.alive || !p1 || !p1.alive) return;
  const dx = p1.x - ai.x, dy = p1.y - ai.y;
  const dist = Math.hypot(dx, dy);
  const predict = dist / 9;
  const fx = p1.x + p1.lastDx * 2 * predict;
  const fy = p1.y + p1.lastDy * 2 * predict;
  ai.aimAt(fx, fy);
  let mx = 0, my = 0;
  if (dist > 260) { mx = dx/dist; my = dy/dist; }
  else if (dist < 130) { mx = -dx/dist; my = -dy/dist; }
  else { const px = -dy/dist, py = dx/dist; mx = px*ai.aiStrafeDir; my = py*ai.aiStrafeDir; }
  if (ai.hp < 30) { mx = -dx/dist; my = -dy/dist; }
  if (ai.dashCd === 0) {
    if (dist < 110 && Math.random() < 0.06) ai.dash(dx/dist, dy/dist);
    else if (ai.hp < 25 && Math.random() < 0.1) ai.dash(-dx/dist, -dy/dist);
  }
  ai.move(mx, my);
  if (ai.reloading === 0 && ai.ammo[ai.weapon] <= 0) ai.startReload();
  if (ai.cooldown === 0 && ai.reloading === 0 && dist < 520) {
    if (Math.random() < 0.3 && dist < 400) ai.weapon = 'shotgun';
    else if (Math.random() < 0.15) ai.weapon = 'laser';
    else ai.weapon = 'pistol';
    const miss = dist/1500;
    ai.angle += (Math.random()-0.5)*miss;
    if (los(ai.x, ai.y, p1.x, p1.y)) {
      const bs = ai.shoot();
      for (const b of bs) bullets.push(b);
    }
  }
  ai.aiTimer++;
  if (ai.aiTimer > 100) { ai.aiTimer = 0; ai.aiStrafeDir *= -1; }
}

function los(x1, y1, x2, y2) {
  for (let i=1; i<30; i++) {
    const t = i/30;
    const x = x1 + (x2-x1)*t, y = y1 + (y2-y1)*t;
    for (const w of WALLS) if (x>w.x && x<w.x+w.w && y>w.y && y<w.y+w.h) return false;
  }
  return true;
}

function checkCollisions() {
  for (const b of bullets) {
    if (!b.alive) continue;
    if (b.owner === ai && p1.alive) {
      const d = Math.hypot(b.x - p1.x, b.y - p1.y);
      if (d < p1.radius + b.radius) {
        if (p1.shield > 0) p1.shield = 0;
        else { p1.hp -= b.damage; p1.flash = 8; explosion(b.x, b.y, C.p1, 15); playHit(); }
        b.alive = false;
        updateHUD();
        if (p1.hp <= 0) { p1.hp = 0; p1.alive = false; explosion(p1.x, p1.y, C.p1, 50); endGame(false); }
      }
    }
    if (b.owner === p1 && ai.alive) {
      const d = Math.hypot(b.x - ai.x, b.y - ai.y);
      if (d < ai.radius + b.radius) {
        if (ai.shield > 0) ai.shield = 0;
        else { ai.hp -= b.damage; ai.flash = 8; explosion(b.x, b.y, C.ai, 18); playHit(); }
        b.alive = false;
        updateHUD();
        if (ai.hp <= 0) { ai.hp = 0; ai.alive = false; explosion(ai.x, ai.y, C.ai, 60); endGame(true); }
      }
    }
  }
}

function endGame(won) {
  gameState = 'over';
  if (won) playWin(); else playLose();
  setTimeout(() => {
    document.getElementById('winEmoji').textContent = won ? '🏆' : '💀';
    document.getElementById('winText').textContent = won ? 'بردی!' : 'باختی!';
    document.getElementById('winText').style.color = won ? '#16a34a' : '#dc2626';
    document.getElementById('winSub').textContent = won ? 'آفرین! ربات رو شکست دادی' : 'دفعه بعد بهتر!';
    document.getElementById('winScreen').style.display = 'flex';
    document.getElementById('controls').style.display = 'none';
  }, 800);
}

function drawGrid() {
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (let x=0; x<W; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<H; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function drawWalls() {
  for (const w of WALLS) {
    ctx.fillStyle = C.wall; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = C.wallTop; ctx.fillRect(w.x, w.y, w.w, 4);
    ctx.strokeStyle = '#050810'; ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }
}

function loop() {
  requestAnimationFrame(loop);
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake -= 0.6; }
  ctx.fillStyle = C.bg; ctx.fillRect(-20, -20, W+40, H+40);
  drawGrid();
  if (gameState === 'playing') {
    if (p1.alive) {
      p1.move(input.x, input.y);
      p1.lastDx = input.x; p1.lastDy = input.y;
      if (input.fire && p1.cooldown === 0 && p1.reloading === 0) {
        const bs = p1.shoot();
        for (const b of bs) bullets.push(b);
        updateAmmoUI();
      }
      if (p1.reloading === 0 && p1.ammo[p1.weapon] <= 0) p1.startReload();
    }
    updateAI();
    for (const b of bullets) b.update();
    bullets = bullets.filter(b => b.alive);
    for (const p of particles) p.update();
    particles = particles.filter(p => p.life > 0);
    checkCollisions();
    p1.update(); ai.update();
    updateAmmoUI();
  }
  drawWalls();
  if (p1 && p1.alive) p1.draw();
  if (ai && ai.alive) ai.draw();
  for (const b of bullets) b.draw();
  for (const p of particles) p.draw();
  ctx.restore();
}

makeWalls();
loop();
</script>
