<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بازی تانک دو نفره</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:#0a0e1a;color:#fff;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
canvas{display:block;max-width:100vw;max-height:100vh;background:#1a1f2e}
.overlay{position:fixed;inset:0;background:rgba(10,14,26,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:10}
.overlay h1{font-size:32px;margin-bottom:12px;color:#c9a961}
.overlay p{font-size:14px;color:#8892a8;margin-bottom:8px;line-height:1.8}
.overlay .keys{display:flex;gap:30px;margin:20px 0;flex-wrap:wrap;justify-content:center}
.overlay .player{background:rgba(255,255,255,0.05);padding:14px 20px;border-radius:12px;border:2px solid}
.overlay .p1{border-color:#dc3232}
.overlay .p2{border-color:#3264dc}
.overlay .player h3{font-size:16px;margin-bottom:8px}
.overlay .player .k{font-size:12px;color:#8892a8;line-height:1.8}
.overlay button{background:linear-gradient(135deg,#c9a961,#a88a45);color:#0a0e1a;border:none;padding:14px 40px;border-radius:10px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px}
.overlay button:active{transform:scale(0.96)}
.win-text{font-size:48px;font-weight:900;margin-bottom:20px}
.win-p1{color:#dc3232}
.win-p2{color:#3264dc}
@media(max-width:500px){.overlay h1{font-size:24px}.overlay .keys{gap:14px}.overlay .player{padding:10px 14px}}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="overlay" id="startScreen">
  <h1>🎮 نبرد تانک‌ها</h1>
  <p>دو نفره، روی یه گوشی</p>
  <div class="keys">
    <div class="player p1">
      <h3 style="color:#dc3232">بازیکن ۱</h3>
      <div class="k">حرکت: W A S D<br>شلیک: SPACE<br>دَش: Q</div>
    </div>
    <div class="player p2">
      <h3 style="color:#3264dc">بازیکن ۲</h3>
      <div class="k">حرکت: ↑ ↓ ← →<br>شلیک: ENTER<br>دَش: RSHIFT</div>
    </div>
  </div>
  <button onclick="startGame()">شروع بازی</button>
</div>

<div class="overlay" id="winScreen" style="display:none">
  <div class="win-text" id="winText">بازیکن ۱ برد!</div>
  <button onclick="restartGame()">دست جدید</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// اندازه
let W, H, CELL;
function resize() {
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  const ratio = 4/3;
  if (maxW / maxH > ratio) {
    H = maxH; W = H * ratio;
  } else {
    W = maxW; H = W / ratio;
  }
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
resize();
window.addEventListener('resize', resize);

// رنگ‌ها
const COLORS = {
  bg: '#1a1f2e',
  grid: '#252b3d',
  wall: '#3a4258',
  wallTop: '#4a5468',
  p1: '#dc3232',
  p1Light: '#ff5555',
  p2: '#3264dc',
  p2Light: '#5580ff',
  bullet: '#ffd700',
  powerup: '#16a34a',
  text: '#fff'
};

// کنترل‌ها
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  keys[e.key] = true;
  keys[e.code] = true;
  if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  keys[e.key] = false;
  keys[e.code] = false;
});

// کلاس تانک
class Tank {
  constructor(x, y, color, colorLight, name, controls) {
    this.x = x;
    this.y = y;
    this.startX = x;
    this.startY = y;
    this.color = color;
    this.colorLight = colorLight;
    this.name = name;
    this.controls = controls;
    this.angle = 0;
    this.speed = 2.5;
    this.radius = 18;
    this.hp = 100;
    this.maxHp = 100;
    this.cooldown = 0;
    this.reloadTime = 40;
    this.alive = true;
    this.score = 0;
    this.shield = 0;
    this.dashCd = 0;
    this.dashTime = 0;
    this.dashDir = {x:0, y:0};
    this.flash = 0;
    this.trackOffset = 0;
  }

  getRect() {
    return { x: this.x - this.radius, y: this.y - this.radius, w: this.radius*2, h: this.radius*2 };
  }

  move() {
    let dx = 0, dy = 0;
    if (keys[this.controls.up]) dy -= 1;
    if (keys[this.controls.down]) dy += 1;
    if (keys[this.controls.left]) dx -= 1;
    if (keys[this.controls.right]) dx += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      this.trackOffset += 0.3;
    }

    let spd = this.speed;
    if (this.dashTime > 0) {
      dx = this.dashDir.x;
      dy = this.dashDir.y;
      spd = this.speed * 3;
      this.dashTime--;
    }

    this.x += dx * spd;
    this.y += dy * spd;
    this.constrain();
  }

  constrain() {
    const r = this.radius;
    this.x = Math.max(r + 20, Math.min(W - r - 20, this.x));
    this.y = Math.max(r + 20, Math.min(H - r - 20, this.y));

    for (const w of WALLS) {
      const rect = this.getRect();
      if (rect.x < w.x + w.w && rect.x + rect.w > w.x &&
          rect.y < w.y + w.h && rect.y + rect.h > w.y) {
        const ol = rect.x + rect.w - w.x;
        const orr = w.x + w.w - rect.x;
        const ot = rect.y + rect.h - w.y;
        const ob = w.y + w.h - rect.y;
        const m = Math.min(ol, orr, ot, ob);
        if (m === ol) this.x -= ol;
        else if (m === orr) this.x += orr;
        else if (m === ot) this.y -= ot;
        else this.y += ob;
      }
    }
  }

  aimAt(tx, ty) {
    this.angle = Math.atan2(ty - this.y, tx - this.x);
  }

  shoot() {
    if (this.cooldown <= 0 && this.alive) {
      this.cooldown = this.reloadTime;
      const bx = this.x + Math.cos(this.angle) * (this.radius + 5);
      const by = this.y + Math.sin(this.angle) * (this.radius + 5);
      return new Bullet(bx, by, this.angle, this.color, this);
    }
    return null;
  }

  dash() {
    if (this.dashCd <= 0 && this.alive) {
      this.dashCd = 100;
      this.dashTime = 8;
      let dx = 0, dy = 0;
      if (keys[this.controls.up]) dy -= 1;
      if (keys[this.controls.down]) dy += 1;
      if (keys[this.controls.left]) dx -= 1;
      if (keys[this.controls.right]) dx += 1;
      if (dx === 0 && dy === 0) {
        dx = Math.cos(this.angle);
        dy = Math.sin(this.angle);
      }
      const l = Math.hypot(dx, dy);
      this.dashDir = { x: dx/l, y: dy/l };
    }
  }

  update() {
    if (this.cooldown > 0) this.cooldown--;
    if (this.dashCd > 0) this.dashCd--;
    if (this.flash > 0) this.flash--;
  }

  draw() {
    if (!this.alive) return;
    // سایه
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(this.x + 3, this.y + 3, this.radius, 0, Math.PI*2);
    ctx.fill();

    // محافظ
    if (this.shield > 0) {
      ctx.strokeStyle = 'rgba(100,200,255,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 8, 0, Math.PI*2);
      ctx.stroke();
    }

    // بدنه
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius - 4, 0, Math.PI*2);
    ctx.fill();

    // چرخ‌ها
    ctx.fillStyle = '#333';
    for (let i = 0; i < 2; i++) {
      const a = this.trackOffset + i * Math.PI;
      const tx = this.x + Math.cos(a) * (this.radius - 8);
      const ty = this.y + Math.sin(a) * (this.radius - 8);
      ctx.beginPath();
      ctx.arc(tx, ty, 4, 0, Math.PI*2);
      ctx.fill();
    }

    // لوله
    const bx = this.x + Math.cos(this.angle) * this.radius;
    const by = this.y + Math.sin(this.angle) * this.radius;
    const ex = this.x + Math.cos(this.angle) * (this.radius + 16);
    const ey = this.y + Math.sin(this.angle) * (this.radius + 16);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    // مرکز
    ctx.fillStyle = this.colorLight;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 8, 0, Math.PI*2);
    ctx.fill();

    // نوار جان
    if (this.hp < this.maxHp) {
      const bw = 46;
      const bx2 = this.x - bw/2;
      const by2 = this.y - this.radius - 16;
      ctx.fillStyle = '#222';
      ctx.fillRect(bx2, by2, bw, 6);
      const hpw = bw * (this.hp / this.maxHp);
      ctx.fillStyle = this.hp > 50 ? '#16a34a' : this.hp > 25 ? '#eab308' : '#dc2626';
      ctx.fillRect(bx2, by2, hpw, 6);
    }
  }
}

// کلاس گلوله
class Bullet {
  constructor(x, y, angle, color, owner) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.speed = 9;
    this.radius = 5;
    this.color = color;
    this.owner = owner;
    this.alive = true;
    this.trail = [];
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;

    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.alive = false;
      return;
    }

    for (const w of WALLS) {
      if (this.x > w.x && this.x < w.x + w.w &&
          this.y > w.y && this.y < w.y + w.h) {
        this.alive = false;
        for (let i = 0; i < 6; i++) particles.push(new Particle(this.x, this.y, '#ffd700'));
        return;
      }
    }
  }

  draw() {
    // دنباله
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const alpha = (i / this.trail.length) * 0.7;
      ctx.fillStyle = 'rgba(255,215,0,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.radius * (i / this.trail.length), 0, Math.PI*2);
      ctx.fill();
    }
    // گلوله
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ذرات
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 30;
    this.maxLife = 30;
    this.color = color;
    this.size = Math.random() * 4 + 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.94;
    this.vy *= 0.94;
    this.life--;
  }
  draw() {
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// آیتم‌ها
class PowerUp {
  constructor(x, y, kind) {
    this.x = x;
    this.y = y;
    this.kind = kind;
    this.radius = 14;
    this.bob = 0;
  }
  update() {
    this.bob += 0.1;
  }
  draw() {
    const y = this.y + Math.sin(this.bob) * 3;
    let color, icon;
    if (this.kind === 'health') { color = '#dc2626'; icon = '+'; }
    else if (this.kind === 'shield') { color = '#3b82f6'; icon = '🛡'; }
    else { color = '#16a34a'; icon = '★'; }

    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(this.x, y, this.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Tahoma';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, this.x, y);
  }
}

// دیوارها
let WALLS = [];

function makeWalls() {
  WALLS = [
    { x: 0, y: 0, w: W, h: 15 },
    { x: 0, y: H - 15, w: W, h: 15 },
    { x: 0, y: 0, w: 15, h: H },
    { x: W - 15, y: 0, w: 15, h: H },
    // چپ بالا
    { x: W * 0.15, y: H * 0.18, w: 25, h: H * 0.18 },
    { x: W * 0.15, y: H * 0.18, w: W * 0.12, h: 25 },
    // راست بالا
    { x: W * 0.73, y: H * 0.18, w: 25, h: H * 0.18 },
    { x: W * 0.61, y: H * 0.18, w: W * 0.12, h: 25 },
    // چپ پایین
    { x: W * 0.15, y: H * 0.64, w: 25, h: H * 0.18 },
    { x: W * 0.15, y: H * 0.79, w: W * 0.12, h: 25 },
    // راست پایین
    { x: W * 0.73, y: H * 0.64, w: 25, h: H * 0.18 },
    { x: W * 0.61, y: H * 0.79, w: W * 0.12, h: 25 },
    // وسط
    { x: W * 0.44, y: H * 0.42, w: W * 0.12, h: 20 },
    { x: W * 0.44, y: H * 0.55, w: W * 0.12, h: 20 },
    { x: W * 0.44, y: H * 0.42, w: 20, h: H * 0.16 },
    { x: W * 0.49, y: H * 0.42, w: 20, h: H * 0.16 }
  ];
}

// وضعیت بازی
let p1, p2, bullets, particles, powerups;
let gameState = 'menu';
let roundNum = 1;
let winnerText = '';
let powerupTimer = 0;
let shake = 0;

// شروع بازی
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  makeWalls();
  p1 = new Tank(W * 0.1, H * 0.5, COLORS.p1, COLORS.p1Light, 'بازیکن ۱', {
    up: 'w', down: 's', left: 'a', right: 'd', shoot: ' ', dash: 'q'
  });
  p2 = new Tank(W * 0.9, H * 0.5, COLORS.p2, COLORS.p2Light, 'بازیکن ۲', {
    up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight',
    shoot: 'Enter', dash: 'Shift'
  });
  p1.angle = 0;
  p2.angle = Math.PI;
  bullets = [];
  particles = [];
  powerups = [];
  powerupTimer = 180;
  gameState = 'playing';
  shake = 0;
}

function restartGame() {
  roundNum++;
  startGame();
}

// شلیک
document.addEventListener('keydown', e => {
  if (gameState !== 'playing') return;
  const k = e.key.toLowerCase();
  const kRaw = e.key;
  const kCode = e.code;

  // بازیکن ۱
  if (kRaw === ' ' || kCode === 'Space') {
    const b = p1.shoot();
    if (b) bullets.push(b);
    e.preventDefault();
  }
  if (k === 'q') p1.dash();

  // بازیکن ۲
  if (kRaw === 'Enter' || kCode === 'Enter') {
    const b = p2.shoot();
    if (b) bullets.push(b);
    e.preventDefault();
  }
  if (kCode === 'ShiftRight' || kRaw === 'Shift') p2.dash();
});

// حرکت تانک‌ها به سمت هم
function autoAim() {
  if (p1.alive) p1.aimAt(p2.x, p2.y);
  if (p2.alive) p2.aimAt(p1.x, p1.y);
}

// بررسی برخورد
function checkCollisions() {
  for (const b of bullets) {
    if (!b.alive) continue;
    // با بازیکن ۱
    if (b.owner !== p1 && p1.alive) {
      const d = Math.hypot(b.x - p1.x, b.y - p1.y);
      if (d < p1.radius + b.radius) {
        if (p1.shield > 0) {
          p1.shield = 0;
        } else {
          p1.hp -= 20;
          p1.flash = 8;
          shake = 10;
        }
        b.alive = false;
        for (let i = 0; i < 12; i++) particles.push(new Particle(b.x, b.y, COLORS.p1));
        if (p1.hp <= 0) {
          p1.hp = 0;
          p1.alive = false;
          endGame('p2');
        }
      }
    }
    // با بازیکن ۲
    if (b.owner !== p2 && p2.alive) {
      const d = Math.hypot(b.x - p2.x, b.y - p2.y);
      if (d < p2.radius + b.radius) {
        if (p2.shield > 0) {
          p2.shield = 0;
        } else {
          p2.hp -= 20;
          p2.flash = 8;
          shake = 10;
        }
        b.alive = false;
        for (let i = 0; i < 12; i++) particles.push(new Particle(b.x, b.y, COLORS.p2));
        if (p2.hp <= 0) {
          p2.hp = 0;
          p2.alive = false;
          endGame('p1');
        }
      }
    }
  }

  // آیتم‌ها
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    for (const t of [p1, p2]) {
      if (!t.alive) continue;
      const d = Math.hypot(pu.x - t.x, pu.y - t.y);
      if (d < t.radius + pu.radius) {
        if (pu.kind === 'health') t.hp = Math.min(t.maxHp, t.hp + 30);
        else if (pu.kind === 'shield') t.shield = 1;
        else t.reloadTime = 20;
        powerups.splice(i, 1);
        for (let j = 0; j < 10; j++) particles.push(new Particle(pu.x, pu.y, COLORS.powerup));
        break;
      }
    }
  }
}

// پایان بازی
function endGame(winner) {
  gameState = 'over';
  winnerText = winner === 'p1' ? 'بازیکن ۱ برد!' : 'بازیکن ۲ برد!';
  setTimeout(() => {
    document.getElementById('winText').textContent = winnerText;
    document.getElementById('winText').className = 'win-text ' + (winner === 'p1' ? 'win-p1' : 'win-p2');
    document.getElementById('winScreen').style.display = 'flex';
  }, 800);
}

// ساخت آیتم تصادفی
function spawnPowerup() {
  const kinds = ['health', 'shield', 'ammo'];
  for (let attempt = 0; attempt < 30; attempt++) {
    const x = 60 + Math.random() * (W - 120);
    const y = 60 + Math.random() * (H - 120);
    let ok = true;
    for (const w of WALLS) {
      if (x > w.x - 20 && x < w.x + w.w + 20 &&
          y > w.y - 20 && y < w.y + w.h + 20) {
        ok = false; break;
      }
    }
    if (ok && Math.hypot(x - p1.x, y - p1.y) > 100 && Math.hypot(x - p2.x, y - p2.y) > 100) {
      powerups.push(new PowerUp(x, y, kinds[Math.floor(Math.random() * kinds.length)]));
      return;
    }
  }
}

// رسم
function drawGrid() {
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  const step = 40;
  for (let x = 0; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawWalls() {
  for (const w of WALLS) {
    ctx.fillStyle = COLORS.wall;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = COLORS.wallTop;
    ctx.fillRect(w.x, w.y, w.w, 4);
    ctx.strokeStyle = '#1a1f2e';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, 50);

  // بازیکن ۱
  ctx.fillStyle = COLORS.p1;
  ctx.font = 'bold 16px Tahoma';
  ctx.textAlign = 'right';
  ctx.fillText('بازیکن ۱', W/2 - 20, 32);
  ctx.fillStyle = '#222';
  ctx.fillRect(W/2 - 180, 20, 100, 12);
  ctx.fillStyle = COLORS.p1;
  ctx.fillRect(W/2 - 180, 20, 100 * (p1.hp/100), 12);

  // بازیکن ۲
  ctx.fillStyle = COLORS.p2;
  ctx.textAlign = 'left';
  ctx.fillText('بازیکن ۲', W/2 + 20, 32);
  ctx.fillStyle = '#222';
  ctx.fillRect(W/2 + 80, 20, 100, 12);
  ctx.fillStyle = COLORS.p2;
  ctx.fillRect(W/2 + 80, 20, 100 * (p2.hp/100), 12);
}

// حلقه بازی
function loop() {
  requestAnimationFrame(loop);

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake -= 0.5;
  }

  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  drawGrid();

  if (gameState === 'playing') {
    // حرکت بازیکن‌ها
    if (p1.alive) p1.move();
    if (p2.alive) p2.move();
    autoAim();

    // آیتم‌ها
    powerupTimer--;
    if (powerupTimer <= 0) {
      spawnPowerup();
      powerupTimer = 300 + Math.random() * 300;
    }

    // گلوله‌ها
    for (const b of bullets) b.update();
    bullets = bullets.filter(b => b.alive);

    // ذرات
    for (const p of particles) p.update();
    particles = particles.filter(p => p.life > 0);

    // آیتم‌ها
    for (const pu of powerups) pu.update();

    checkCollisions();

    p1.update();
    p2.update();
  }

  // رسم
  drawWalls();
  for (const pu of powerups) pu.draw();
  if (p1 && p1.alive) p1.draw();
  if (p2 && p2.alive) p2.draw();
  for (const b of bullets) b.draw();
  for (const p of particles) p.draw();

  if (gameState === 'playing' || gameState === 'over') {
    drawHUD();
  }

  ctx.restore();
}

// شروع
makeWalls();
loop();
