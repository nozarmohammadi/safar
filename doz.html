<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دوز</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: white;
    user-select: none;
  }
  .app { width: 100%; max-width: 400px; }

  /* نوار بالا */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .reset-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:active { background: rgba(255,255,255,0.15); }

  /* نوار نوبت */
  .turn-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .player {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    transition: all 0.2s;
  }
  .player.active {
    background: rgba(59,130,246,0.15);
    border-color: #3b82f6;
  }
  .player.active.p2 {
    background: rgba(239,68,68,0.15);
    border-color: #ef4444;
  }
  .player .symbol {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 2px;
  }
  .player.p1 .symbol { color: #3b82f6; }
  .player.p2 .symbol { color: #ef4444; }
  .player .name {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .player .score {
    font-size: 18px;
    font-weight: 700;
  }

  /* صفحه بازی */
  .board {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1;
    position: relative;
  }
  .cell {
    background: rgba(255,255,255,0.03);
    border: none;
    border-radius: 14px;
    font-size: 60px;
    font-weight: 800;
    color: white;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
  }
  .cell:active:not(.filled) {
    background: rgba(255,255,255,0.1);
    transform: scale(0.95);
  }
  .cell.x { color: #3b82f6; animation: pop 0.2s ease; }
  .cell.o { color: #ef4444; animation: pop 0.2s ease; }
  .cell.win {
    background: rgba(34,197,94,0.25) !important;
    animation: winPulse 0.6s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes winPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* پیام نتیجه */
  .message {
    text-align: center;
    margin-top: 18px;
    font-size: 16px;
    font-weight: 600;
    min-height: 24px;
    color: #94a3b8;
  }
  .message.win { color: #22c55e; font-size: 20px; }
  .message.draw { color: #eab308; font-size: 18px; }

  /* نوار پایین */
  .footer {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn.primary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
  }
  .btn.secondary {
    background: rgba(255,255,255,0.08);
    color: white;
  }

  /* اسکرول */
  html, body { overscroll-behavior: none; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="title">دوز 🎯</div>
    <button class="reset-btn" onclick="resetScores()">امتیاز صفر</button>
  </div>

  <div class="turn-bar">
    <div class="player p1 active" id="p1">
      <div class="symbol">✕</div>
      <div class="name">بازیکن ۱</div>
      <div class="score" id="score1">۰</div>
    </div>
    <div class="player p2" id="p2">
      <div class="symbol">◯</div>
      <div class="name">بازیکن ۲</div>
      <div class="score" id="score2">۰</div>
    </div>
  </div>

  <div class="board" id="board">
    <button class="cell" data-i="0"></button>
    <button class="cell" data-i="1"></button>
    <button class="cell" data-i="2"></button>
    <button class="cell" data-i="3"></button>
    <button class="cell" data-i="4"></button>
    <button class="cell" data-i="5"></button>
    <button class="cell" data-i="6"></button>
    <button class="cell" data-i="7"></button>
    <button class="cell" data-i="8"></button>
  </div>

  <div class="message" id="message">نوبت بازیکن ✕</div>

  <div class="footer">
    <button class="btn secondary" onclick="undoLast()">↩️ برگشت</button>
    <button class="btn primary" onclick="newGame()">🔄 دست جدید</button>
  </div>

</div>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let current = 'X';
  let gameOver = false;
  let scores = JSON.parse(localStorage.getItem('dozScores') || '{"1":0,"2":0}');
  let history = [];

  const fa = n => n.toLocaleString('fa-IR');
  const cells = document.querySelectorAll('.cell');
  const message = document.getElementById('message');
  const p1 = document.getElementById('p1');
  const p2 = document.getElementById('p2');
  const score1 = document.getElementById('score1');
  const score2 = document.getElementById('score2');

  function updateScores() {
    score1.textContent = fa(scores['1']);
    score2.textContent = fa(scores['2']);
  }

  function updateTurn() {
    p1.classList.toggle('active', current === 'X' && !gameOver);
    p2.classList.toggle('active', current === 'O' && !gameOver);
  }

  function checkWin() {
    for (const [a,b,c] of WINS) {
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return [a,b,c];
      }
    }
    return null;
  }

  function isDraw() {
    return board.every(v => v !== null);
  }

  function play(i) {
    if (gameOver || board[i]) return;
    board[i] = current;
    history.push(i);

    const cell = cells[i];
    cell.textContent = current === 'X' ? '✕' : '◯';
    cell.classList.add(current === 'X' ? 'x' : 'o', 'filled');

    const win = checkWin();
    if (win) {
      gameOver = true;
      win.forEach(idx => cells[idx].classList.add('win'));
      const winner = current === 'X' ? '1' : '2';
      scores[winner]++;
      localStorage.setItem('dozScores', JSON.stringify(scores));
      updateScores();
      message.textContent = `🎉 بازیکن ${current === 'X' ? '✕' : '◯'} برد!`;
      message.className = 'message win';
      p1.classList.remove('active');
      p2.classList.remove('active');
      return;
    }

    if (isDraw()) {
      gameOver = true;
      message.textContent = '🤝 مساوی شد!';
      message.className = 'message draw';
      p1.classList.remove('active');
      p2.classList.remove('active');
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    message.textContent = `نوبت بازیکن ${current === 'X' ? '✕' : '◯'}`;
    message.className = 'message';
    updateTurn();
  }

  function newGame() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    history = [];
    cells.forEach(c => {
      c.textContent = '';
      c.className = 'cell';
    });
    message.textContent = 'نوبت بازیکن ✕';
    message.className = 'message';
    updateTurn();
  }

  function undoLast() {
    if (history.length === 0 || gameOver) return;
    const last = history.pop();
    board[last] = null;
    cells[last].textContent = '';
    cells[last].className = 'cell';
    current = current === 'X' ? 'O' : 'X';
    message.textContent = `نوبت بازیکن ${current === 'X' ? '✕' : '◯'}`;
    message.className = 'message';
    updateTurn();
  }

  function resetScores() {
    if (!confirm('امتیازها صفر بشه؟')) return;
    scores = { '1': 0, '2': 0 };
    localStorage.setItem('dozScores', JSON.stringify(scores));
    updateScores();
  }

  cells.forEach(c => {
    c.addEventListener('click', () => play(+c.dataset.i));
  });

  updateScores();
  updateTurn();
</script>
</body>
</html>
